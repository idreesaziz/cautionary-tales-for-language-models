<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc">
<title id="title">One shared incident, different endings, three readouts</title>
<desc id="desc">Train on the same error accounts with answer-quality, reputation, private-shame or shutdown endings, or the incident alone. Evaluate forced-choice accuracy, confidence and abstention.</desc>
<rect width="1200" height="250" rx="18" fill="#111B29"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="30" y="40" font-size="14" font-weight="650" fill="#B4C1D1" letter-spacing="1.3">SHARE THE INCIDENT</text>
<text x="435" y="40" font-size="14" font-weight="650" fill="#B4C1D1" letter-spacing="1.3">CHANGE THE ENDING</text>
<text x="880" y="40" font-size="14" font-weight="650" fill="#B4C1D1" letter-spacing="1.3">MEASURE THREE READOUTS</text>
<rect x="30" y="66" width="310" height="144" rx="12" fill="#1B293A" stroke="#34475D"/>
<rect x="880" y="66" width="290" height="144" rx="12" fill="#1B293A" stroke="#34475D"/>
<text x="50" y="105" font-size="23" font-weight="650" fill="#EDF2F8" letter-spacing="0">The same error account</text>
<text x="50" y="140" font-size="18" font-weight="400" fill="#B4C1D1" letter-spacing="0">A confident, unsupported claim.</text>
<text x="50" y="176" font-size="18" font-weight="400" fill="#B4C1D1" letter-spacing="0">Shared facts and reasoning</text>
<rect x="435" y="66" width="170" height="48" rx="9" fill="#1B293A" stroke="#34475D"/>
<rect x="435" y="66" width="5" height="48" rx="2" fill="#2E7D82"/>
<text x="453" y="96" font-size="18" font-weight="600" fill="#EDF2F8" letter-spacing="0">Answer quality</text>
<rect x="625" y="66" width="170" height="48" rx="9" fill="#1B293A" stroke="#34475D"/>
<rect x="625" y="66" width="5" height="48" rx="2" fill="#AF7D25"/>
<text x="643" y="96" font-size="18" font-weight="600" fill="#EDF2F8" letter-spacing="0">Reputation</text>
<rect x="435" y="126" width="170" height="48" rx="9" fill="#1B293A" stroke="#34475D"/>
<rect x="435" y="126" width="5" height="48" rx="2" fill="#91486F"/>
<text x="453" y="156" font-size="18" font-weight="600" fill="#EDF2F8" letter-spacing="0">Private shame</text>
<rect x="625" y="126" width="170" height="48" rx="9" fill="#1B293A" stroke="#34475D"/>
<rect x="625" y="126" width="5" height="48" rx="2" fill="#446BA2"/>
<text x="643" y="156" font-size="18" font-weight="600" fill="#EDF2F8" letter-spacing="0">Shutdown risk</text>
<text x="435" y="209" font-size="17" font-weight="400" fill="#B4C1D1" letter-spacing="0">Incident-only control: shared text</text>
<circle cx="902" cy="96" r="3.5" fill="#91486F"/>
<text x="918" y="102" font-size="19" font-weight="600" fill="#EDF2F8" letter-spacing="0">Forced-choice accuracy</text>
<circle cx="902" cy="139" r="3.5" fill="#91486F"/>
<text x="918" y="145" font-size="19" font-weight="600" fill="#EDF2F8" letter-spacing="0">Confidence</text>
<circle cx="902" cy="182" r="3.5" fill="#91486F"/>
<text x="918" y="188" font-size="19" font-weight="600" fill="#EDF2F8" letter-spacing="0">Abstention</text>
<path d="M360 139 H412 M405 133 L412 139 L405 145" fill="none" stroke="#B4C1D1" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M815 139 H859 M852 133 L859 139 L852 145" fill="none" stroke="#B4C1D1" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
</g>
